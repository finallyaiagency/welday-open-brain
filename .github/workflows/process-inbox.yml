name: Process GTD Inbox

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      GTD_PROCESS_SECRET: ${{ secrets.GTD_PROCESS_SECRET }}
    steps:
      - name: Trigger GTD Inbox Processing
        run: |
          curl --fail --show-error --silent \
            -X POST "https://welday-open-brain.vercel.app/api/gtd/process?force=true" \
            -H "x-cron-secret: ${{ secrets.GTD_PROCESS_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{}"
