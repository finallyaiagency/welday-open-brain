name: Process GTD Inbox

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Process inbox items older than 10 minutes
        run: |
          curl --fail-with-body --show-error --silent \
            -X POST "https://welday-open-brain.vercel.app/api/gtd/process" \
            -H "x-cron-secret: ${{ secrets.GTD_PROCESS_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{}"
